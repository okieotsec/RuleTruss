name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, so a new advisory, Python release or runner image is noticed without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the runtime dependency (hash-checked) and the test library
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-test.txt
      - name: Run the tests
        run: python -u -X dev -W error::ResourceWarning tools/ci_run_tests.py 1500

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes -r requirements-lint.txt
      - name: ruff
        run: ruff check .
      - name: privacy check (the maintainer's private deny-list, absolute paths; built-in checks only where the secret is unavailable)
        env:
          PRIVACY_DENYLIST_CONTENT: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -n "$PRIVACY_DENYLIST_CONTENT" ]; then
            python tools/privacy_check.py --tree
          else
            python tools/privacy_check.py --tree --no-denylist
          fi
      - name: bandit (application code, not the tests)
        run: bandit -q -r ruletruss tools
      - name: semgrep
        run: semgrep scan --config p/python --config p/security-audit --metrics off --error --quiet ruletruss tools
      - name: pip-audit
        # Two named exceptions, both in packages that only semgrep brings in and pins, and that CI never exercises:
        # GHSA-84m7-p3x7-pcfv (memory growth in `mcp`'s stateful HTTP server transport). `mcp` is pinned by semgrep to exactly 1.29.0, and CI
        # runs `semgrep scan` once and never starts an MCP server, so the code is not reached. Remove it when semgrep allows mcp 1.30.0 or later.
        # CVE-2026-116684 affects the MCP server; CVE-2026-116685 affects MCP HTTP clients following cross-origin redirects, and CVE-2026-116686
        # affects clients validating tool-result schemas. All are in `mcp` 1.29.0 (fixed in 1.30.0), which semgrep pins exactly.
        # This invocation scans only `ruletruss` and `tools`; it has no MCP client/server integration, creates no MCP session or HTTP request,
        # and processes no MCP tool results, so neither the server nor client vulnerability paths are reached. Remove these with the GHSA exception
        # when semgrep allows `mcp` 1.30.0 or later.
        # GHSA-xcq7-p3pf-p88h (slow parsing of an incoming `tracestate` header in `opentelemetry-api`, fixed in 1.45.1). semgrep pins
        # `opentelemetry-api~=1.37.0` (every release up to 1.182.1 does), the flaw needs a server that accepts requests carrying trace headers,
        # and CI runs `semgrep scan` once with metrics off and never starts a server, so as far as we can tell the code is not reached.
        # Remove it when semgrep allows opentelemetry-api 1.45.1 or later. Dependabot will propose both upgrades.
        run: pip-audit -r requirements.txt -r requirements-test.txt -r requirements-lint.txt -r requirements-workflow.txt --require-hashes --ignore-vuln GHSA-84m7-p3x7-pcfv --ignore-vuln GHSA-xcq7-p3pf-p88h --ignore-vuln CVE-2026-116684 --ignore-vuln CVE-2026-116685 --ignore-vuln CVE-2026-116686

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
