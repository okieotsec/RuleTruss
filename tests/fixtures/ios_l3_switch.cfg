Building configuration...
version 17.9
hostname dist-sw
!
ip routing
!
ip access-list extended USERS-IN
 remark users may reach the web servers and DNS only
 10 permit tcp 10.10.10.0 0.0.0.255 10.10.30.0 0.0.0.255 eq 443
 20 permit udp 10.10.10.0 0.0.0.255 host 10.10.30.53 eq 53
 30 permit tcp 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255 established
 40 deny ip any any log
ip access-list extended SERVERS-OUT
 remark what may leave the switch toward the server VLAN
 10 permit tcp 10.10.10.0 0.0.0.255 10.10.30.0 0.0.0.255 eq 443
 20 permit tcp 10.10.20.0 0.0.0.255 10.10.30.0 0.0.0.255 eq 22
 30 deny ip any any
ip access-list extended PORT-IN
 10 permit ip any any
!
vlan access-map NO-TELNET 10
 match ip address TELNET
 action drop
vlan filter NO-TELNET vlan-list 10
!
interface Vlan10
 description users
 ip address 10.10.10.1 255.255.255.0
 ip access-group USERS-IN in
!
interface Vlan20
 description admins
 ip address 10.10.20.1 255.255.255.0
!
interface Vlan30
 description servers
 ip address 10.10.30.1 255.255.255.0
 ip access-group SERVERS-OUT out
!
interface Vlan40
 description retired
 ip address 10.10.40.1 255.255.255.0
 shutdown
!
interface GigabitEthernet1/0/5
 switchport mode access
 switchport access vlan 10
 ip access-group PORT-IN in
!
