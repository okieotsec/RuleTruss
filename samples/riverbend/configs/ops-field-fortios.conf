#config-version=FGT80F-7.2.5-FW-build1517-230606:opmode=0:vdom=0
config system global
    set hostname "rb-ops-field-fw"
    set admin-password ENC SH2notarealencryptedvalue
end
config system interface
    edit "ops"
        set vdom "root"
        set ip 10.20.0.3 255.255.255.0
        set type vlan
        set vlanid 20
    next
    edit "cell1"
        set vdom "root"
        set ip 10.30.1.1 255.255.255.0
        set type vlan
        set vlanid 11
    next
    edit "cell2"
        set vdom "root"
        set ip 10.30.2.1 255.255.255.0
        set type vlan
        set vlanid 12
    next
end
config system zone
    edit "field"
        set interface "cell1" "cell2"
    next
end
config firewall address
    edit "scada1"
        set subnet 10.20.0.10 255.255.255.255
    next
    edit "scada2"
        set subnet 10.20.0.11 255.255.255.255
    next
    edit "historian"
        set subnet 10.20.0.20 255.255.255.255
    next
    edit "eng1"
        set subnet 10.20.0.50 255.255.255.255
    next
    edit "eng2"
        set subnet 10.20.0.51 255.255.255.255
    next
    edit "hmi1"
        set subnet 10.20.0.60 255.255.255.255
    next
    edit "hmi2"
        set subnet 10.20.0.61 255.255.255.255
    next
    edit "netmon"
        set subnet 10.20.0.70 255.255.255.255
    next
    edit "ops-svc"
        set subnet 10.20.0.2 255.255.255.255
    next
    edit "cell1-net"
        set subnet 10.30.1.0 255.255.255.0
    next
    edit "cell2-net"
        set subnet 10.30.2.0 255.255.255.0
    next
    edit "plc-dosing"
        set subnet 10.30.2.30 255.255.255.255
    next
    edit "plc-treat1"
        set subnet 10.30.2.21 255.255.255.255
    next
    edit "vendor-telemetry"
        set type fqdn
        set fqdn "telemetry.vendor.example"
    next
end
config firewall addrgrp
    edit "grp-scada"
        set member "scada1" "scada2"
    next
    edit "grp-hmi"
        set member "hmi1" "hmi2"
    next
    edit "grp-masters"
        set member "grp-scada" "grp-hmi"
    next
    edit "grp-eng"
        set member "eng1" "eng2"
    next
    edit "field-nets"
        set member "cell1-net" "cell2-net"
    next
end
config firewall vip
    edit "hist-vip"
        set extip 10.20.0.100
        set extintf "ops"
        set mappedip "10.20.0.20"
    next
end
config firewall service custom
    edit "MODBUS"
        set tcp-portrange 502
    next
    edit "S7COMM"
        set tcp-portrange 102
    next
    edit "ENIP"
        set tcp-portrange 44818
        set udp-portrange 44818 2222
    next
end
config firewall policy
    edit 1
        set name "scada-modbus"
        set srcintf "ops"
        set dstintf "cell1"
        set action accept
        set srcaddr "grp-masters"
        set dstaddr "cell1-net"
        set schedule "always"
        set service "MODBUS"
    next
    edit 2
        set name "scada-s7"
        set srcintf "ops"
        set dstintf "cell2"
        set action accept
        set srcaddr "grp-scada"
        set dstaddr "cell2-net"
        set schedule "always"
        set service "S7COMM"
    next
    edit 3
        set name "eng-enip"
        set srcintf "ops"
        set dstintf "cell2"
        set action accept
        set srcaddr "grp-eng"
        set dstaddr "plc-dosing"
        set schedule "always"
        set service "ENIP"
    next
    edit 4
        set name "eng-s7"
        set srcintf "ops"
        set dstintf "cell2"
        set action accept
        set srcaddr "grp-eng"
        set dstaddr "cell2-net"
        set schedule "always"
        set service "S7COMM"
    next
    edit 5
        set name "eng-commissioning-anything"
        set srcintf "ops"
        set dstintf "field"
        set action accept
        set srcaddr "grp-eng"
        set dstaddr "field-nets"
        set schedule "always"
        set service "ALL"
        set comments "commissioning of the new filter bank; never removed"
    next
    edit 6
        set name "eng1-ssh"
        set srcintf "ops"
        set dstintf "cell2"
        set action accept
        set srcaddr "eng1"
        set dstaddr "cell2-net"
        set schedule "always"
        set service "SSH"
    next
    edit 7
        set name "netmon-snmp"
        set srcintf "ops"
        set dstintf "field"
        set action accept
        set srcaddr "netmon"
        set dstaddr "field-nets"
        set schedule "always"
        set service "SNMP"
    next
    edit 8
        set name "netmon-ping"
        set srcintf "ops"
        set dstintf "field"
        set action accept
        set srcaddr "netmon"
        set dstaddr "field-nets"
        set schedule "always"
        set service "PING"
    next
    edit 9
        set name "field-ntp"
        set srcintf "field"
        set dstintf "ops"
        set action accept
        set srcaddr "field-nets"
        set dstaddr "ops-svc"
        set schedule "always"
        set service "NTP"
    next
    edit 10
        set name "field-syslog"
        set srcintf "field"
        set dstintf "ops"
        set action accept
        set srcaddr "field-nets"
        set dstaddr "ops-svc"
        set schedule "always"
        set service "SYSLOG"
    next
    edit 11
        set name "plc-telemetry"
        set srcintf "cell2"
        set dstintf "ops"
        set action accept
        set srcaddr "plc-treat1"
        set dstaddr "vendor-telemetry"
        set schedule "always"
        set service "HTTPS"
        set nat enable
    next
    edit 12
        set name "contractors-business-hours"
        set srcintf "ops"
        set dstintf "cell1"
        set action accept
        set srcaddr "all"
        set dstaddr "cell1-net"
        set schedule "business-hours"
        set service "ALL"
        set groups "Contractors"
    next
    edit 13
        set name "temporary-commissioning"
        set srcintf "ops"
        set dstintf "field"
        set action accept
        set status disable
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 14
        set name "cell1-to-historian"
        set srcintf "cell1"
        set dstintf "ops"
        set action accept
        set srcaddr "cell1-net"
        set dstaddr "hist-vip"
        set schedule "always"
        set service "HTTPS"
    next
    edit 15
        set name "no-action-set-by-mistake"
        set srcintf "ops"
        set dstintf "cell1"
        set srcaddr "hmi2"
        set dstaddr "cell1-net"
        set schedule "always"
        set service "HTTP"
    next
end
