version 17.9
hostname ot-dist-sw
!
enable secret 9 $9$thisshouldneverappear
username netadmin privilege 15 secret 5 $1$leak$leakleakleak
!
ip access-list extended OT-TO-CTRL
 remark engineering to controllers
 10 permit tcp 10.20.1.0 0.0.0.255 10.30.2.0 0.0.0.255 eq 502
 20 permit tcp 10.20.1.0 0.0.0.255 host 10.30.2.40 range 44818 44819
 30 permit tcp 10.30.2.0 0.0.0.255 10.20.1.0 0.0.0.255 established
 40 permit udp any host 10.30.2.40 eq 161
 45 permit icmp 10.20.1.0 0.0.0.255 10.30.2.0 0.0.0.255 echo
 50 deny ip any any log
ip access-list extended FROM-CTRL
 10 permit tcp 10.30.2.0 0.0.0.255 eq 502 10.20.1.0 0.0.0.255 established
 20 permit udp host 10.30.2.40 eq 161 any
 30 deny ip any any
ip access-list extended ODD
 10 permit ip 10.0.0.0 0.255.0.255 any
 20 permit tcp any any eq 22 dscp ef
 30 permit tcp any any eq 23 reflect MIRROR
access-list 101 permit tcp any any eq 22
access-list 10 permit 10.20.1.0 0.0.0.255
ipv6 access-list V6-OT
 permit tcp 2001:db8:20::/64 2001:db8:30::/64 eq 502
 deny ipv6 any any
!
interface Vlan20
 ip address 10.20.1.1 255.255.255.0
 ip access-group OT-TO-CTRL in
!
interface Vlan30
 ip address 10.30.2.1 255.255.255.0
 ip access-group FROM-CTRL in
!
interface Vlan40
 ip address 10.40.1.1 255.255.255.0
