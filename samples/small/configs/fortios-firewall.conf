#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0
config system global
    set hostname "plant-fgt-1"
    set admin-password ENC SH2abcdefthisshouldnotappear
end
config system interface
    edit "port1"
        set ip 203.0.113.2 255.255.255.0
        set alias "WAN"
    next
    edit "port2"
        set ip 10.20.0.1 255.255.0.0
        set alias "ENG"
    next
    edit "port3"
        set ip 10.30.0.1 255.255.0.0
        set alias "OT"
    next
end
config system zone
    edit "internal-zone"
        set interface "port2" "port3"
    next
end
config firewall address
    edit "ews"
        set subnet 10.20.1.15 255.255.255.255
    next
    edit "ews2"
        set subnet 10.20.1.16 255.255.255.255
    next
    edit "plc-net"
        set subnet 10.30.2.0 255.255.255.0
    next
    edit "hist-range"
        set type iprange
        set start-ip 10.30.5.10
        set end-ip 10.30.5.12
    next
    edit "vendor"
        set type fqdn
        set fqdn "updates.vendor.example"
    next
    edit "geo-x"
        set type geography
        set country "XX"
    next
end
config firewall address6
    edit "plc6"
        set ip6 2001:db8:30::/64
    next
end
config firewall addrgrp
    edit "eng-hosts"
        set member "ews" "ews2"
    next
    edit "eng-all"
        set member "eng-hosts"
    next
end
config firewall vip
    edit "hist-vip"
        set extip 203.0.113.50
        set extintf "port1"
        set mappedip "10.30.5.10"
        set portforward enable
        set extport 443
        set mappedport 443
    next
end
config firewall service custom
    edit "MODBUS"
        set tcp-portrange 502
    next
    edit "ENIP"
        set tcp-portrange 44818 2222
        set udp-portrange 2222
    next
    edit "SNMP-X"
        set udp-portrange 161-162
    next
    edit "ICMP-ECHO"
        set protocol ICMP
        set icmptype 8
    next
end
config firewall service group
    edit "ICS"
        set member "MODBUS" "ENIP"
    next
end
config firewall policy
    edit 1
        set name "eng-to-plc"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "eng-all"
        set dstaddr "plc-net"
        set schedule "always"
        set service "ICS"
        set logtraffic all
    next
    edit 2
        set name "eng-ping"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "eng-hosts"
        set dstaddr "plc-net"
        set schedule "always"
        set service "ICMP-ECHO"
    next
    edit 3
        set name "disabled-rdp"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set status disable
        set srcaddr "all"
        set dstaddr "hist-range"
        set schedule "always"
        set service "RDP"
    next
    edit 4
        set name "plc-updates"
        set srcintf "port3"
        set dstintf "port1"
        set action accept
        set srcaddr "plc-net"
        set dstaddr "vendor"
        set schedule "always"
        set service "HTTPS"
        set nat enable
    next
    edit 5
        set name "users-only"
        set srcintf "internal-zone"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "hist-range"
        set schedule "always"
        set service "SSH"
        set groups "Engineers"
    next
    edit 6
        set name "business-hours"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "business-hours"
        set service "HTTP"
    next
    edit 7
        set name "vip-in"
        set srcintf "port1"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "hist-vip"
        set schedule "always"
        set service "HTTPS"
    next
    edit 8
        set name "deny-geo"
        set srcintf "port1"
        set dstintf "port3"
        set action deny
        set srcaddr "geo-x"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 9
        set name "no-action-set"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end
config firewall policy6
    edit 20
        set name "v6-ot"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr6 "all"
        set dstaddr6 "plc6"
        set schedule "always"
        set service "MODBUS"
    next
end
