!
hostname plant-fw-1
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.2 255.255.255.0
!
interface GigabitEthernet0/1
 nameif corp
 security-level 50
 ip address 10.10.0.1 255.255.0.0
!
interface GigabitEthernet0/2
 nameif ot
 security-level 90
 ip address 10.20.0.1 255.255.0.0
!
interface GigabitEthernet0/3
 nameif dmz
 security-level 30
 ip address 10.50.0.1 255.255.255.0
!
name 10.20.1.15 eng-ws-1
!
object network EWS
 host 10.20.1.15
object network PLC-NET
 subnet 10.30.2.0 255.255.255.0
object network HISTORIAN
 host 10.30.5.10
object network VENDOR-FQDN
 fqdn v4 updates.vendor.example
object network WEB-SRV
 host 10.50.0.10
 nat (dmz,outside) static 203.0.113.10
!
object-group network ENGINEERING
 network-object object EWS
 network-object host 10.20.1.16
object-group network OT-ALL
 group-object ENGINEERING
 network-object object PLC-NET
object-group network LOOP-A
 group-object LOOP-B
object-group network LOOP-B
 group-object LOOP-A
object-group service OT-PROTOS tcp
 port-object eq 502
 port-object range 44818 44819
object-group service WEB-PORTS tcp-udp
 port-object eq 443
object-group service MIXED
 service-object tcp destination eq 102
 service-object udp destination eq 161
 service-object icmp echo
object network PLC-NET-ICS
 subnet 10.30.3.0 255.255.255.0
!
access-list OT-IN remark Engineering to controllers
access-list OT-IN extended permit tcp object-group ENGINEERING object PLC-NET object-group OT-PROTOS
access-list OT-IN extended permit tcp host 10.20.1.20 object PLC-NET eq 22
access-list OT-IN extended deny ip any any log
access-list OT-IN extended permit tcp any object PLC-NET eq 80
access-list CORP-IN extended permit tcp 10.10.0.0 255.255.0.0 object HISTORIAN eq 443
access-list CORP-IN extended permit icmp 10.10.0.0 255.255.0.0 any echo
access-list CORP-IN extended permit tcp any object VENDOR-FQDN eq 443
access-list CORP-IN extended permit tcp any any eq 8080 time-range BUSINESS-HOURS
access-list CORP-IN extended permit object-group MIXED object-group OT-ALL any
access-list CORP-IN extended permit tcp any host 10.30.5.10 eq 3389 inactive
access-list OUT-IN extended permit tcp any object WEB-SRV eq https
access-list OUT-IN extended permit tcp any6 any6 eq 22
access-list GLOBAL-ACL extended permit udp any host 10.30.5.10 eq 123
access-list GLOBAL-ACL extended permit tcp user-group DOMAIN\Engineers any any eq 22
access-list UNUSED extended permit ip any any
access-group OT-IN in interface ot
access-group CORP-IN in interface corp
access-group OUT-IN in interface outside
access-group GLOBAL-ACL global
!
nat (corp,outside) source dynamic any interface
!
username admin password $1$abcdefgh$abcdef encrypted
snmp-server community s3cr3tcommunity
